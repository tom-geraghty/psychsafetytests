name: Quick check
# Run by hand after any change (about a minute): key pages, contact form,
# payments, search, feed, certificate. If it fails twice in a row (two minutes
# apart), an issue is opened and assigned to the repo owner, which sends an
# email. It closes itself once a later run passes.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quick-check
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Check both sites (and again two minutes later if anything fails)
        id: check
        continue-on-error: true
        run: npm run smoke || (echo "Failed once; checking again in two minutes to rule out a blip" && sleep 120 && npm run smoke)

      - name: Raise or clear the alarm
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/alert.cjs')({ github, context, core }, {
              label: 'site-problem',
              title: '🔴 Website problem: the quick check is failing',
              summaryFile: 'results/smoke.md',
              failed: '${{ steps.check.outcome }}' === 'failure',
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - if: steps.check.outcome == 'failure'
        run: exit 1
